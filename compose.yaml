name: veche-of-heroes

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: veche
      MYSQL_USER: veche
      MYSQL_PASSWORD: ${DB_PASSWORD:-veche-local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-veche-root-local}
      TZ: UTC
    volumes:
      - veche_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 3s
      timeout: 3s
      retries: 25
  web:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: veche
      TRANSFER_MMR_LOSS: ${TRANSFER_MMR_LOSS:-20}
      APP_DEMO: ${APP_DEMO:-1}
      DB_USER: veche
      DB_PASSWORD: ${DB_PASSWORD:-veche-local}
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  veche_data:
